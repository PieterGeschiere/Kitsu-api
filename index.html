<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Every anime Pieter has finished, pulled live from Kitsu.">
    <title>Pieter's anime library</title>
    <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
  </head>

  <body>
    <header class="masthead">
      <div class="wrap masthead-inner">
        <div>
          <p class="eyebrow">Kitsu library &middot; Pieter</p>
          <h1>Watched</h1>
        </div>
        <dl class="stats" id="stats" aria-live="polite">
          <div><dt>Titles</dt><dd data-stat="titles">&ndash;</dd></div>
          <div><dt>Episodes</dt><dd data-stat="episodes">&ndash;</dd></div>
          <div><dt>Rated 10/10</dt><dd data-stat="perfect">&ndash;</dd></div>
        </dl>
      </div>
    </header>

    <div class="toolbar">
      <div class="wrap toolbar-inner">
        <label class="search">
          <span class="visually-hidden">Search titles</span>
          <input id="search" type="search" placeholder="Search titles" autocomplete="off">
        </label>

        <div class="filters" id="filters" role="group" aria-label="Filter by format">
          <button type="button" class="chip is-active" data-type="all">All</button>
        </div>

        <div class="sort" id="sort">
          <span class="sort-label" id="sort-label">Sort</span>
          <button type="button" class="sort-trigger" id="sort-trigger"
                  aria-haspopup="listbox" aria-expanded="false"
                  aria-labelledby="sort-label sort-trigger">
            <span id="sort-current">My rating</span>
            <svg class="sort-caret" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true">
              <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
          <ul class="sort-menu" id="sort-menu" role="listbox" tabindex="-1"
              aria-labelledby="sort-label" hidden>
            <li role="option" data-value="rating" aria-selected="true">My rating</li>
            <li role="option" data-value="added">Recently added</li>
            <li role="option" data-value="community">Community score</li>
            <li role="option" data-value="newest">Release: newest</li>
            <li role="option" data-value="oldest">Release: oldest</li>
            <li role="option" data-value="title">Title A&ndash;Z</li>
          </ul>
        </div>
      </div>
    </div>

    <main class="wrap">
      <p class="result-count" id="result-count" aria-live="polite"></p>
      <ol class="grid" id="grid"></ol>
      <nav class="pagination" id="pagination" aria-label="Pages" hidden></nav>
      <div class="state" id="state" hidden></div>
    </main>

    <footer class="wrap footer">
      <p>Data from the <a href="https://kitsu.app" rel="noopener">Kitsu</a> public API. Titles rated R are left out.</p>
    </footer>

    <dialog class="detail" id="detail" aria-labelledby="detail-title">
      <form method="dialog" class="detail-close-form">
        <button class="detail-close" aria-label="Close">Close</button>
      </form>
      <div class="detail-body">
        <img class="detail-poster" id="detail-poster" alt="">
        <div class="detail-text">
          <p class="detail-meta" id="detail-meta"></p>
          <h2 id="detail-title"></h2>
          <dl class="detail-scores" id="detail-scores"></dl>
          <div class="detail-synopsis" id="detail-synopsis"></div>
          <a class="detail-link" id="detail-link" target="_blank" rel="noopener">View on Kitsu</a>
        </div>
      </div>
    </dialog>

    <script src="./assets/js/app.js"></script>
  </body>
</html>
